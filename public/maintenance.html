<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Maintenance Mode | Cavios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body
    class="min-h-screen bg-gradient-to-br from-blue-950 via-slate-900 to-black flex items-center justify-center text-white">

    <div class="max-w-xl w-full text-center px-6">

        <!-- Icon -->
        <div class="mb-6">
            <i class="fa-solid fa-server text-6xl text-blue-400 animate-pulse"></i>
        </div>

        <!-- Title -->
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">
            We’ll Be Back Soon
        </h1>

        <!-- Subtitle -->
        <p class="text-gray-300 text-lg mb-6">
            Cavios is currently undergoing scheduled maintenance.<br class="hidden sm:block" />
            We’re working hard to bring everything back online shortly.
        </p>

        <!-- Info Box -->
        <div class="bg-white/10 border border-white/20 rounded-xl p-5 mb-6 backdrop-blur">
            <div class="flex items-center justify-center gap-3 mb-2">
                <i class="fa-solid fa-wrench text-blue-400"></i>
                <span class="font-semibold">Maintenance in Progress</span>
            </div>
            <p class="text-sm text-gray-300">
                Some services may be temporarily unavailable during this time.
            </p>
        </div>

        <!-- Contact -->
        <p class="text-sm text-gray-400">
            Need help? Contact us at
            <a href="mailto:support@cavios.com" class="text-blue-400 hover:underline">
                support@cavios.com
            </a>
        </p>

        <!-- Footer -->
        <div class="mt-8 text-xs text-gray-500">
            © <span id="year"></span> Cavios. All rights reserved.
        </div>
    </div>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>

</html>
